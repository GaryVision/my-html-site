                setAnswers(newAns);
                
                if (qIdx < 59) {
                    setQIdx(qIdx + 1);
                } else {
                    setIsRunning(false); // 停止计时
                    window.scrollTo(0,0);
                    setView('result');
                }
            };

            const scores = useMemo(() => {
                const s = { R:0, I:0, A:0, S:0, E:0, C:0 };
                const order = ['R','I','A','S','E','C'];
                answers.forEach((v, i) => {
                    s[order[Math.floor(i / 10)]] += v;
                });
                return s;
            }, [answers]);

            const top3 = Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,3);

            if (view === 'home') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50 text-slate-800">
                    <div className="text-center max-w-3xl">
                        <div className="inline-block bg-blue-100 text-blue-700 px-4 py-1 rounded-full text-xs font-semibold tracking-wider mb-6 border border-blue-200">
                            基于 O*NET 国际权威题库
                        </div>
                        <h1 className="text-4xl md:text-5xl font-bold mb-4 text-slate-900">霍兰德职业兴趣测试</h1>
                        <p className="text-slate-500 mb-10 text-sm">Holland Occupational Themes (RIASEC)</p>
                        
                        <div className="bg-white p-8 md:p-10 rounded-2xl text-left mb-10 border border-slate-200 shadow-sm">
                            <h3 className="font-semibold mb-6 text-slate-800 text-lg flex items-center gap-2 border-b border-slate-100 pb-3">
                                测试说明
                            </h3>
                            <div className="space-y-4 text-sm text-slate-600">
                                <p>1. 本测试包含 <strong>60道题目</strong>，采用直译的国际通用测试题（原题附英文对比）。</p>
                                <p>2. 请根据您的<strong>真实喜好</strong>作答，而不是根据您认为自己是否擅长或是否能赚多少钱来判断。</p>
                                <p>3. 测试报告将结合中国大陆市场的真实情况（附带学信网专业参考与BOSS直聘职位链接）为您提供5个梯度的职业建议。</p>
                            </div>
                        </div>
                        <button onClick={startTest} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold text-lg transition-all active:scale-95 shadow-md">
                            开始测试
                        </button>
                    </div>
                </div>
            );

            if (view === 'test') {
                const currentQ = QUESTIONS[qIdx];
                const types = ['R','I','A','S','E','C'];
                const curType = types[Math.floor(qIdx / 10)];
                const subProgress = (qIdx % 10) + 1; // 当前分类下第几题
                const totalProgress = Math.round(((qIdx + 1) / 60) * 100);

                return (
                    <div className="min-h-screen flex flex-col p-6 max-w-3xl mx-auto bg-white shadow-sm border-x border-slate-100">
                        {/* 顶部状态栏 */}
                        <div className="flex justify-between items-center mt-4 mb-12 border-b border-slate-100 pb-6">
                            <div className="flex items-center gap-4">
                                <div className="w-10 h-10 rounded-lg flex items-center justify-center text-white font-bold text-lg" style={{backgroundColor: CAREER_MAP[curType].color}}>
                                    {curType}
                                </div>
                                <div>
                                    <div className="font-bold text-slate-800">{CAREER_MAP[curType].name}题目</div>
                                    <div className="text-xs text-slate-500 font-medium">类目进度: <span style={{color: CAREER_MAP[curType].color}}>{subProgress} / 10</span></div>
                                </div>
                            </div>
                            
                            <div className="flex flex-col items-end gap-2">
                                <div className="flex items-center gap-2 text-sm font-semibold text-slate-600 bg-slate-50 px-3 py-1.5 rounded-md border border-slate-200">
                                    <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    {formatTime(timeElapsed)}
                                </div>
                                <div className="text-xs font-semibold text-slate-400">总进度: {qIdx + 1}/60</div>
                            </div>
                        </div>

                        {/* 进度条 */}
                        <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden mb-12">
                            <div className="h-full transition-all duration-300 ease-out" style={{width: `${totalProgress}%`, backgroundColor: CAREER_MAP[curType].color}}></div>
                        </div>

                        {/* 题目展示区域 */}
                        <div className="flex-1 flex flex-col justify-center mb-16 px-4">
                            <h2 className="text-2xl md:text-3xl font-bold text-slate-800 mb-3 text-center leading-snug">
                                {currentQ.cn}
                            </h2>
                            <p className="text-base md:text-lg font-normal text-slate-400 text-center">
                                {currentQ.en}
                            </p>
                        </div>

                        {/* 选项按钮 */}
                        <div className="grid grid-cols-1 md:grid-cols-5 gap-3 mb-10">
                            {[
                                {l:'非常喜欢', e:'Strongly Like', v:4, bg:'bg-green-500', hover:'hover:bg-green-600'},
                                {l:'喜欢', e:'Like', v:3, bg:'bg-emerald-400', hover:'hover:bg-emerald-500'},
                                {l:'中立 / 无感', e:'Neutral', v:2, bg:'bg-slate-300', text:'text-slate-700', hover:'hover:bg-slate-400'},
                                {l:'不喜欢', e:'Dislike', v:1, bg:'bg-orange-400', hover:'hover:bg-orange-500'},
                                {l:'非常不喜欢', e:'Strongly Dislike', v:0, bg:'bg-red-500', hover:'hover:bg-red-600'}
                            ].map(opt => (
                                <button 
                                    key={opt.l} 
                                    onClick={()=>handleSelect(opt.v)} 
                                    className={`${opt.bg} ${opt.hover} ${opt.text || 'text-white'} py-4 rounded-xl transition-all flex flex-col items-center justify-center font-semibold shadow-sm active:scale-95`}
                                >
                                    <span className="text-base mb-1">{opt.l}</span>
                                </button>
                            ))}
                        </div>
                        
                        <div className="flex justify-center mt-auto pb-4">
                            <button onClick={()=>qIdx > 0 && setQIdx(qIdx-1)} className={`text-sm font-medium px-6 py-2 rounded-full transition-colors ${qIdx === 0 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-800'}`} disabled={qIdx === 0}>
                                ← 返回上一题
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-10 max-w-6xl mx-auto transition-all">
                    {/* Header */}
                    <header className="text-center mb-16 bg-white p-10 rounded-3xl shadow-sm border border-slate-200">
                        <div className="text-sm font-semibold text-slate-500 mb-2 border border-slate-200 inline-block px-3 py-1 rounded-full bg-slate-50">
                            测试用时：{formatTime(timeElapsed)}
                        </div>
                        <h2 className="text-slate-900 text-2xl md:text-3xl font-bold mb-6">您的职业兴趣代码 (Holland Code)</h2>
                        <div className="flex justify-center items-end gap-3 md:gap-6 mb-6">
                            {top3.map(([k], index) => (
                                <div key={k} className="flex flex-col items-center">
                                    <span className={`font-bold ${index === 0 ? 'text-7xl md:text-8xl' : 'text-5xl md:text-6xl opacity-70'}`} style={{color: CAREER_MAP[k].color}}>{k}</span>
                                    {index === 0 && <span className="text-xs font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded mt-2">主要倾向</span>}
                                </div>
                            ))}
                        </div>
                    </header>

                    {/* Results */}
                    <div className="space-y-12">
                        {top3.map(([k], i) => (
                            <div key={k} className="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-slate-200">
                                
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 border-b border-slate-100 pb-6">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 rounded-xl flex items-center justify-center text-white font-bold text-2xl" style={{backgroundColor: CAREER_MAP[k].color}}>
                                            {k}
                                        </div>
                                        <div>
                                            <h3 className="text-2xl font-bold text-slate-800">{CAREER_MAP[k].name}</h3>
                                            <div className="text-xs text-slate-500 font-medium uppercase">{CAREER_MAP[k].en}</div>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-xs text-slate-400 font-medium mb-1">倾向得分 (0-40)</div>
                                        <div className="text-xl font-bold text-slate-700">{scores[k]}</div>
                                    </div>
                                </div>
                                
                                <div className="grid lg:grid-cols-2 gap-8 mb-10">
                                    <div>
                                        <h4 className="font-bold text-slate-800 mb-3 text-base flex items-center gap-2">
                                            <span className="w-1.5 h-4 rounded-full" style={{backgroundColor: CAREER_MAP[k].color}}></span>
                                            性格特征与职业环境
                                        </h4>
                                        <p className="text-slate-600 leading-relaxed text-sm text-justify">
                                            {CAREER_MAP[k].analysis}
                                        </p>
                                    </div>
                                    
                                    <div className="bg-slate-50 rounded-2xl p-5 border border-slate-200">
                                        <div className="flex justify-between items-start mb-4">
                                            <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                                                🎓 学信网 (CHSI) 专业参考
                                            </h4>
                                            <a href={CAREER_MAP[k].chsi.link} target="_blank" className="text-[10px] bg-white text-slate-600 border border-slate-300 px-2.5 py-1 rounded hover:bg-slate-100 transition-colors">官方数据查询↗</a>
                                        </div>
                                        <div className="mb-3">
                                            <div className="text-xs font-semibold text-slate-500 mb-1">对口专业示例</div>
                                            <div className="text-sm font-semibold text-slate-700">{CAREER_MAP[k].chsi.majors}</div>
                                        </div>
                                        <div>
                                            <div className="text-xs font-semibold text-slate-500 mb-1">就业现状分析</div>
                                            <p className="text-slate-600 text-xs leading-relaxed text-justify">
                                                {CAREER_MAP[k].chsi.analysis}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <h4 className="font-bold text-slate-800 mb-4 text-base flex items-center gap-2">
                                        <span className="w-1.5 h-4 rounded-full" style={{backgroundColor: CAREER_MAP[k].color}}></span>
                                        典型职业路径推荐 (5类学历梯度)
                                    </h4>
                                    <div className="overflow-x-auto no-scrollbar pb-2">
                                        <div className="flex md:grid md:grid-cols-5 gap-3 min-w-max md:min-w-full">
                                            {CAREER_MAP[k].jobs.map((job, jIdx) => (
                                                <div key={job.n} className="w-56 md:w-auto bg-white border border-slate-200 rounded-xl p-4 hover-card-shadow transition-all flex flex-col justify-between">
                                                    <div>
                                                        <div className="text-[10px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded inline-block mb-2">
                                                            {job.edu}
                                                        </div>
                                                        <h5 className="font-bold text-slate-800 text-sm mb-3 h-10">{job.n}</h5>
                                                        
                                                        <div className="space-y-2 mb-4">
                                                            <div className="flex justify-between items-center text-xs">
                                                                <span className="text-slate-500">主流月薪</span>
                                                                <span className="font-semibold text-slate-700">{job.apr}</span>
                                                            </div>
                                                            <div className="flex justify-between items-center text-xs">
                                                                <span className="text-slate-500">年龄区间</span>
                                                                <span className="text-slate-700">{job.age} 岁</span>
                                                            </div>
                                                            <div className="flex justify-between items-center text-xs">
                                                                <span className="text-slate-500">性别分布</span>
                                                                <span className="text-slate-700">{job.gender}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    
                                                    <a href={job.link} target="_blank" className="block w-full text-center bg-slate-50 border border-slate-200 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-colors">
                                                        BOSS直聘查询
                                                    </a>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <footer className="mt-16 text-center">
                        <button onClick={()=>window.location.reload()} className="px-8 py-3 bg-slate-800 text-white rounded-lg font-semibold text-sm hover:bg-slate-700 transition-colors">
                            重新测试
                        </button>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
