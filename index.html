            { id: 53, type: 'C', cn: "安装软件", en: "Install software across network" },
            { id: 54, type: 'C', cn: "计算员工工资", en: "Calculate employee wages" },
            { id: 55, type: 'C', cn: "组织会议", en: "Organize office meetings" },

        const CHINA_QUESTIONS = [

            { id: 6, type: 'R', cn: "操作农业机械、拖拉机", en: "Operate farm machinery" },

            { id: 9, type: 'R', cn: "修理故障水管", en: "Fix faulty water pipes" },
            { id: 10, type: 'R', cn: "进行房屋室内装修", en: "Interior renovation" },
            { id: 11, type: 'I', cn: "阅读科学杂志文章", en: "Read scientific articles" },

            { id: 13, type: 'I', cn: "解几何题", en: "Solve geometry problems" },
            { id: 14, type: 'I', cn: "了解人体的生理解剖结构", en: "Understand human anatomy" },
            { id: 15, type: 'I', cn: "去气象站观察气象变化", en: "Observe weather changes" },
            { id: 16, type: 'I', cn: "通过观察显微镜下的细胞", en: "Observe cells under microscope" },
            { id: 17, type: 'I', cn: "研究动植物的生长规律", en: "Study growth patterns" },
            { id: 18, type: 'I', cn: "调查导致环境污染的原因", en: "Investigate pollution causes" },
            { id: 19, type: 'I', cn: "拆卸并重新组装旧表", en: "Disassemble/reassemble watches" },
            { id: 20, type: 'I', cn: "对新发现的现象提出假设", en: "Propose scientific hypotheses" },
            { id: 21, type: 'A', cn: "为报刊画插图或进行装帧设计", en: "Design magazine illustrations" },
            { id: 22, type: 'A', cn: "创作歌曲或进行舞蹈编导", en: "Compose music/choreography" },
            { id: 23, type: 'A', cn: "表演乐器或歌唱", en: "Perform music/singing" },
            { id: 24, type: 'A', cn: "写诗歌或科幻小说", en: "Write poems or sci-fi" },
            { id: 25, type: 'A', cn: "练习书法或篆刻", en: "Practice calligraphy/engraving" },
            { id: 26, type: 'A', cn: "作为专业摄影师摄影", en: "Work as photographer" },
            { id: 27, type: 'A', cn: "参加话剧或小品表演", en: "Act in plays" },
            { id: 28, type: 'A', cn: "设计新颖的服装或工艺品", en: "Design fashion/crafts" },
            { id: 29, type: 'A', cn: "去美术馆欣赏名画", en: "Visit art galleries" },
            { id: 30, type: 'A', cn: "制作陶瓷或雕塑", en: "Make pottery/sculptures" },
            { id: 31, type: 'S', cn: "在敬老院里照顾孤寡老人", en: "Care for the elderly" },
            { id: 32, type: 'S', cn: "教导残疾儿童读书识字", en: "Teach disabled children" },
            { id: 33, type: 'S', cn: "调解邻里间的矛盾冲突", en: "Mediate neighborhood conflicts" },
            { id: 34, type: 'S', cn: "作为志愿者参加社区服务", en: "Volunteer for community service" },
            { id: 35, type: 'S', cn: "为有困难的人提供法律咨询", en: "Provide legal consultation" },
            { id: 36, type: 'S', cn: "教授学生体育锻炼技巧", en: "Teach PE skills" },
            { id: 37, type: 'S', cn: "去医院探望并安慰病人", en: "Visit and comfort patients" },
            { id: 38, type: 'S', cn: "进行心理健康咨询", en: "Mental health counseling" },
            { id: 39, type: 'S', cn: "组织青少年夏令营活动", en: "Organize summer camps" },
            { id: 40, type: 'S', cn: "协助人们纠正不良习惯", en: "Help correct bad habits" },
            { id: 41, type: 'E', cn: "向别人推销新产品", en: "Sell new products" },
            { id: 42, type: 'E', cn: "在班级里担任班长职务", en: "Serve as class monitor" },
            { id: 43, type: 'E', cn: "组织一场大型的促销集会", en: "Organize sales rallies" },
            { id: 44, type: 'E', cn: "管理一家商店或连锁餐厅", en: "Manage store/restaurant" },
            { id: 45, type: 'E', cn: "说服他人改变观点", en: "Persuade others' opinions" },
            { id: 46, type: 'E', cn: "参加公共辩论赛", en: "Participate in debates" },
            { id: 47, type: 'E', cn: "竞选政府职位或领导岗", en: "Run for leadership/office" },
            { id: 48, type: 'E', cn: "策划并实施一个商业方案", en: "Plan/execute business plan" },
            { id: 49, type: 'E', cn: "代表集体利益向上级争取", en: "Advocate for group interests" },
            { id: 50, type: 'E', cn: "负责管理一项投资项目", en: "Manage investment project" },
            { id: 51, type: 'C', cn: "整理财务档案并归类", en: "Organize financial files" },
            { id: 52, type: 'C', cn: "核对发票上的各项数字", en: "Verify invoice figures" },
            { id: 53, type: 'C', cn: "在银行柜台处理储蓄业务", en: "Process banking business" },
            { id: 54, type: 'C', cn: "记录单位每天的考勤情况", en: "Record daily attendance" },
            { id: 55, type: 'C', cn: "撰写标准化的公文或报告", en: "Write official documents" },
            { id: 56, type: 'C', cn: "进行人口普查的数据录入", en: "Input census data" },
            { id: 57, type: 'C', cn: "维护一套高效的资料系统", en: "Maintain data systems" },
            { id: 58, type: 'C', cn: "检查合同中的文字错误", en: "Check contract typos" },
            { id: 59, type: 'C', cn: "计算复杂的财务报表", en: "Calculate financial reports" },
            { id: 60, type: 'C', cn: "分门别类投递信件", en: "Sort and deliver mail" }
        ];

        // 2. 录取分数线走势组件 (使用 Recharts)
        const TrendChart = ({ data, color }) => {
            return (
                <div className="h-32 w-full mt-4">
                    <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={data}>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                            <Tooltip contentStyle={{fontSize: '10px', borderRadius: '8px'}} />
                            <Line type="monotone" dataKey="v" stroke={color} strokeWidth={3} dot={{r:4}} />
                        </LineChart>
                    </ResponsiveContainer>
                    <div className="text-[8px] text-center text-slate-400 font-bold tracking-widest mt-1 uppercase">录取分线 5-Year Trend (540-640)</div>
                </div>
            );
        };

        function App() {
            const [step, setStep] = useState('home');
            const [mode, setMode] = useState('CN'); 
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState(new Array(60).fill(null));

            const activeQuestions = useMemo(() => {
                return mode === 'CN' ? CHINA_QUESTIONS : US_QUESTIONS;
            }, [mode]);

            const scores = useMemo(() => {
                const s = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
                answers.forEach((v, i) => { if (v !== null) s[activeQuestions[i].type] += v; });
                return s;
            }, [answers, activeQuestions]);

            const topThree = useMemo(() => {
                return Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, 3);
            }, [scores]);

            const handleAnswer = (val) => {
                const newA = [...answers];
                newA[currentIndex] = val;
                setAnswers(newA);
                if (currentIndex < 59) setCurrentIndex(currentIndex + 1);
                else setStep('result');
            };

            const startTest = (m) => {
                setMode(m);
                setAnswers(new Array(60).fill(null));
                setCurrentIndex(0);
                setStep('test');
            };

            if (step === 'home') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                    <div className="max-w-2xl w-full text-center">
                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-blue-100 text-blue-700 rounded-full text-xs font-black mb-8 uppercase">
                            <Icons.Zap /> HOLLAND ASSESSMENT SYSTEM v3.0
                        </div>
                        <h1 className="text-5xl sm:text-6xl font-black text-slate-900 mb-8 tracking-tighter">霍兰德职业兴趣</h1>
                        <p className="text-slate-500 mb-12 text-lg leading-relaxed">基于 R-I-A-S-E-C 理论，提供中国本土与美国官方双版本题库，<br/>精准定位你的核心竞争优势。</p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <button onClick={() => startTest('CN')} className="group p-8 bg-white border-2 border-slate-200 rounded-[2rem] hover:border-blue-500 transition-all flex flex-col items-center gap-4 shadow-sm hover:shadow-xl">
                                <Icons.MapPin className="text-red-500 group-hover:scale-110 transition-transform" />
                                <div className="text-left">
                                    <span className="block text-xl font-black text-slate-900">中国本土版</span>
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">CHSI Standard</span>
                                </div>
                            </button>
                            <button onClick={() => startTest('US')} className="group p-8 bg-white border-2 border-slate-200 rounded-[2rem] hover:border-blue-500 transition-all flex flex-col items-center gap-4 shadow-sm hover:shadow-xl">
                                <Icons.Globe className="text-blue-500 group-hover:scale-110 transition-transform" />
                                <div className="text-left">
                                    <span className="block text-xl font-black text-slate-900">美国劳工局版</span>
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">O*NET Standard</span>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            );

            if (step === 'test') {
                const q = activeQuestions[currentIndex];
                const progress = ((currentIndex + 1) / 60) * 100;
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-between p-8">
                        <div className="w-full max-w-2xl mt-8">
                            <div className="flex justify-between text-[10px] font-black text-slate-400 mb-4 tracking-widest uppercase">
                                <span>Question {currentIndex + 1} / 60</span>
                                <span>{mode === 'CN' ? '中国版' : 'US Edition'} · {q.type}</span>
                            </div>
                            <div className="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                                <div className="h-full bg-blue-600 transition-all duration-300" style={{ width: `${progress}%` }}></div>
                            </div>
                        </div>

                        <div className="w-full max-w-2xl bg-white p-12 sm:p-20 rounded-[3rem] border border-slate-100 shadow-sm text-center">
                            <p className="text-sm font-bold text-slate-300 mb-4 uppercase tracking-tighter italic">{q.en}</p>
                            <h2 className="text-3xl sm:text-4xl font-black text-slate-900 mb-16 leading-tight">
                                {q.cn}
                            </h2>
                            <div className="space-y-3">
                                {[
                                    { l: "非常喜欢", s: 4, c: "hover:bg-green-50 text-green-700 border-green-100" },
                                    { l: "喜欢", s: 3, c: "hover:bg-blue-50 text-blue-700 border-blue-100" },
                                    { l: "无感", s: 2, c: "hover:bg-slate-50 text-slate-600 border-slate-100" },
                                    { l: "不喜欢", s: 1, c: "hover:bg-orange-50 text-orange-700 border-orange-100" },
                                    { l: "非常不喜欢", s: 0, c: "hover:bg-red-50 text-red-700 border-red-100" }
                                ].map(opt => (
                                    <button key={opt.s} onClick={() => handleAnswer(opt.s)} 
                                        className={`w-full py-4 px-8 text-left rounded-2xl border font-bold transition-all flex justify-between items-center group ${opt.c}`}>
                                        {opt.l} <Icons.ChevronRight />
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="w-full max-w-2xl mb-8 flex justify-between">
                            <button onClick={() => currentIndex > 0 && setCurrentIndex(currentIndex - 1)} className={`flex items-center gap-2 text-sm font-bold ${currentIndex === 0 ? 'opacity-0' : 'text-slate-400 hover:text-slate-900'}`}>
                                <Icons.ChevronLeft /> 上一步
                            </button>
                            <button onClick={() => setStep('home')} className="text-[10px] font-black text-slate-300 tracking-widest uppercase hover:text-red-500">退出测试</button>
                        </div>
                    </div>
                );
            }

            const radarData = Object.keys(DIMENSIONS).map(k => ({ subject: k, A: scores[k] }));

            return (
                <div className="max-w-6xl mx-auto p-6 sm:p-12 animate-in fade-in duration-1000">
                    <header className="mb-16 pb-8 border-b border-slate-100 flex flex-col md:flex-row justify-between items-end gap-6">
                        <div>
                            <div className="text-[10px] font-black text-blue-600 mb-2 uppercase tracking-[0.4em]">Holland Analysis ({mode})</div>
                            <h1 className="text-6xl font-black text-slate-900 tracking-tighter">
                                职业代码: <span className="text-blue-600">{topThree.map(t => t[0]).join('')}</span>
                            </h1>
                        </div>
                        <div className="flex gap-2">
                            {topThree.map(([type]) => (
                                <span key={type} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-black shadow-lg">
                                    {DIMENSIONS[type].name}
                                </span>
                            ))}
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-16 items-start mb-20">
                        <div className="lg:col-span-5 flex flex-col items-center bg-white p-10 rounded-[3rem] border border-slate-100 shadow-xl shadow-slate-200/50">
                            <h3 className="font-black text-slate-400 text-[10px] uppercase tracking-widest mb-8 italic">兴趣雷达图</h3>
                            <div className="w-full h-[350px]">
                                {Radar && (
                                    <ResponsiveContainer width="100%" height="100%">
                                        <RadarChart data={radarData}>
                                            <PolarGrid stroke="#e2e8f0" />
                                            <PolarAngleAxis dataKey="subject" tick={{ fill: '#94a3b8', fontSize: 14, fontWeight: 900 }} />
                                            <PolarRadiusAxis angle={30} domain={[0, 4]} tick={false} axisLine={false} />
                                            <Radar name="Score" dataKey="A" stroke="#2563eb" fill="#3b82f6" fillOpacity={0.4} />
                                        </RadarChart>
                                    </ResponsiveContainer>
                                )}
                            </div>
                        </div>

                        <div className="lg:col-span-7 space-y-8">
                            <h3 className="font-black text-slate-400 text-[10px] uppercase tracking-widest italic">核心维度解析</h3>
                            {topThree.map(([type, score]) => (
                                <div key={type} className="group p-10 bg-white border border-slate-100 rounded-[2.5rem] hover:shadow-2xl hover:shadow-slate-200/60 transition-all duration-500">
                                    <div className="flex justify-between items-start mb-8">
                                        <div className="flex items-center gap-5">
                                            <div className="w-14 h-14 rounded-2xl flex items-center justify-center text-white text-xl font-black shadow-lg" style={{ background: DIMENSIONS[type].color }}>{type}</div>
                                            <div>
                                                <h4 className="text-2xl font-black text-slate-900">{DIMENSIONS[type].name}</h4>
                                                <p className="text-xs text-slate-400 font-bold uppercase tracking-tight">{type}-Type / {score} pts</p>
                                            </div>
                                        </div>
                                    </div>
                                    <p className="text-slate-600 leading-relaxed mb-10 text-lg">{DIMENSIONS[type].analysis}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-12">
                        {topThree.map(([type]) => (
                            <div key={type} className="flex flex-col p-8 border border-slate-100 rounded-[2.5rem] bg-white shadow-sm hover:shadow-2xl transition-all">
                                {/* 头部信息 */}
                                <div className="flex items-center gap-3 mb-6">
                                    <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-black" style={{background: DIMENSIONS[type].color}}>{type}</div>
                                    <h4 className="text-xl font-black text-slate-900">{DIMENSIONS[type].name}型</h4>
                                </div>

                                {/* 分数走势图 */}
                                <TrendChart data={DIMENSIONS[type].trends} color={DIMENSIONS[type].color} />

                                {/* 职业推荐列表 */}
                                <div className="space-y-4 my-8 flex-grow">
                                    {DIMENSIONS[type].careers.map(job => (
                                        <div key={job.n} className={`p-4 rounded-2xl border ${job.niche ? 'bg-indigo-50/50 border-indigo-100' : 'bg-slate-50/50 border-slate-100'}`}>
                                            <div className="flex justify-between items-start mb-1">
                                                <span className="font-bold text-slate-900 text-sm flex items-center gap-1">
                                                    {job.n} {job.niche && <span className="text-[8px] bg-indigo-500 text-white px-1 rounded">潜力冷门</span>}
                                                </span>
                                                <span className="text-xs font-black text-blue-600 italic">{job.s}</span>
                                            </div>
                                            <div className="grid grid-cols-2 gap-y-1 text-[10px] text-slate-500 font-bold tracking-tighter">
                                                <span>🎓 目标：{job.score} 分段</span>
                                                <span>🚻 性别：{job.sex}</span>
                                                <span>⏳ 黄金期：{job.age}岁</span>
                                                <span>🔗 <a href={job.chsi} target="_blank" className="text-blue-500 underline">学信网专业</a></span>
                                                <span>🔗 <a href={job.boss} target="_blank" className="text-blue-500 underline col-span-2">BOSS直聘实时岗位</a></span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    <footer className="mt-24 py-12 border-t border-slate-100 text-center flex flex-col items-center gap-6">
                        <button onClick={() => setStep('home')} className="px-8 py-3 border-2 border-slate-200 rounded-2xl text-xs font-black text-slate-400 hover:bg-slate-900 hover:text-white hover:border-slate-900 transition-all uppercase tracking-widest">
                            重新开始测评
                        </button>
                        <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em]">Holland Career Finder &copy; 2025 v3.0 Full Edition</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <script>
        // 检查关键库是否加载完成
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (typeof React === 'undefined') {
                    document.getElementById('loading').innerHTML = '<h2 style="color:red;">错误: React 加载失败</h2><p>请检查网络连接并刷新页面</p>';
                }
                if (typeof window.Recharts === 'undefined') {
                    console.warn('警告: Recharts 加载失败，图表功能将不可用');
                }
            }, 2000);
        });
    </script>
</body>
</html>
